<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Menu Display AI</title>

<style>
body {
  margin:0;
  font-family: Arial, Helvetica, sans-serif;
  background:#f3f3f3;
  color:#1d1d1f;
}

.app {
  padding:20px;
}

.box {
  background:white;
  padding:20px;
  border-radius:16px;
  margin-bottom:20px;
}

textarea, input {
  width:100%;
  padding:10px;
  margin-top:8px;
  border:1px solid #ccc;
  box-sizing:border-box;
}

button {
  width:100%;
  padding:12px;
  margin-top:10px;
  font-weight:bold;
  cursor:pointer;
}

/* DISPLAY */
.display {
  width:794px;
  min-height:1123px;
  background:white;
  margin:30px auto;
  padding:50px;
  box-sizing:border-box;
}

.top {
  display:flex;
  justify-content:space-between;
  align-items:center;
  direction:ltr;
}

.logo {
  font-weight:bold;
  letter-spacing:1.5px;
  color:#666;
}

.kosher {
  font-weight:bold;
}

.kosher-meat { color:#d92d20; }
.kosher-dairy { color:#175cd3; }
.kosher-parve { color:#027a48; }

.category {
  display:inline-block;
  margin-top:10px;
  background:#f2f4f7;
  padding:6px 14px;
  border-radius:16px;
  font-weight:bold;
}

.price {
  text-align:right;
  font-size:28px;
  font-weight:bold;
  margin-top:20px;
}

.title {
  font-size:34px;
  font-weight:900;
  margin-top:20px;
}

.desc {
  font-size:18px;
  margin-top:10px;
}

.section-title {
  margin-top:20px;
  font-size:12px;
  font-weight:bold;
  letter-spacing:1px;
  color:#777;
}

.ingredients {
  font-size:14px;
  margin-top:8px;
}

.allergens-box {
  margin-top:20px;
  border:1px solid #ddd;
  border-radius:16px;
  padding:12px;
}

.allergens-grid {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.allergen {
  padding:6px;
  border-radius:10px;
  background:#f5f5f5;
  text-align:center;
  font-weight:bold;
  font-size:13px;
}

@media print {
  .app { display:none; }
  body { background:white; }
}
</style>
</head>

<body>

<div class="app">

<h3>הדבק טקסט</h3>
<textarea id="raw"></textarea>
<button onclick="runExtract()">Extract</button>

<input id="price" placeholder="מחיר">

<button onclick="createDisplay()">Create</button>
<button onclick="window.print()">PDF</button>

</div>

<div class="display">

<div class="top">
  <div class="logo">CAFFÈ MACS</div>
  <div class="kosher" id="kosherOut"></div>
</div>

<div class="category" id="categoryOut"></div>

<div class="price" id="priceOut"></div>

<div class="title" id="nameEnOut"></div>
<div class="desc" id="descEnOut"></div>

<div class="section-title">INGREDIENTS</div>
<div class="ingredients" id="ingEnOut"></div>

<hr>

<div class="title" id="nameHeOut"></div>
<div class="desc" id="descHeOut"></div>

<div class="section-title">רכיבים</div>
<div class="ingredients" id="ingHeOut"></div>

<div class="allergens-box">
  <div class="section-title">ALLERGENS / אלרגנים</div>
  <div class="allergens-grid" id="allergensOut"></div>
</div>

</div>

<script>
function safe(v){return v||""}

function splitCategory(cat){
  let station = cat;
  let kosher = "";

  if(cat.includes("Meat")) { kosher="בשרי"; station=cat.replace("(Meat)","").trim(); }
  if(cat.includes("Dairy")) { kosher="חלבי"; station=cat.replace("(Dairy)","").trim(); }
  if(cat.includes("Parve")) { kosher="פרווה"; station=cat.replace("(Parve)","").trim(); }

  return {station,kosher};
}

async function runExtract(){
  const res = await fetch("/extract",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({text:raw.value})
  });

  const d = await res.json();

  const cat = splitCategory(safe(d.category));

  window.dataStore = {
    nameEn:d.dish_name_en,
    nameHe:d.dish_name_he,
    descEn:d.description_en,
    descHe:d.description_he,
    ingEn:d.ingredients_en,
    ingHe:d.ingredients_he,
    allEn:d.allergens_en,
    allHe:d.allergens_he,
    station:cat.station,
    kosher:cat.kosher
  }
}

function createDisplay(){

const d = window.dataStore || {}

priceOut.innerText = price.value ? "₪"+price.value+".00":""

categoryOut.innerText = d.station

kosherOut.innerText = d.kosher
kosherOut.className="kosher"

if(d.kosher==="בשרי") kosherOut.classList.add("kosher-meat")
if(d.kosher==="חלבי") kosherOut.classList.add("kosher-dairy")
if(d.kosher==="פרווה") kosherOut.classList.add("kosher-parve")

nameEnOut.innerText = d.nameEn
nameHeOut.innerText = d.nameHe
descEnOut.innerText = d.descEn
descHeOut.innerText = d.descHe
ingEnOut.innerText = d.ingEn
ingHeOut.innerText = d.ingHe

allergensOut.innerHTML=""
const en = d.allEn?.split(",")||[]
const he = d.allHe?.split(",")||[]

for(let i=0;i<Math.max(en.length,he.length);i++){
  const div=document.createElement("div")
  div.className="allergen"
  div.innerText=(en[i]||"")+" "+(he[i]||"")
  allergensOut.appendChild(div)
}

}
</script>

</body>
</html>
