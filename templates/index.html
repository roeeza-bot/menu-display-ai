<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Caffè Macs Display Generator</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #ececef;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  padding: 24px;
}

.container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
}

/* ===== LEFT SIDE ===== */

.card {
  background: white;
  padding: 20px;
  border-radius: 16px;
  margin-bottom: 20px;
}

textarea {
  width: 100%;
  height: 180px;
  padding: 10px;
}

button {
  padding: 10px 16px;
  border: none;
  border-radius: 999px;
  background: #0071e3;
  color: white;
  cursor: pointer;
}

/* ===== DISPLAY ===== */

.page-wrap {
  width: 100%;
  background: white;
  border-radius: 28px;
  box-shadow: 0 18px 55px rgba(0,0,0,0.14);
  padding: 42px 48px 36px;
  position: relative;
}

.top-accent {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 10px;
  background: linear-gradient(90deg, #0071e3, #70a7ff);
}

.brand-title {
  text-align: center;
  margin-bottom: 28px;
  font-size: 34px;
  font-weight: 860;
}

/* HEADER */

.header-card {
  border: 1px solid #e5e5ea;
  background: #f8f8fa;
  border-radius: 24px;
  padding: 20px;
  display: flex;
  justify-content: space-between;
}

.station-line {
  font-size: 20px;
  font-weight: 700;
}

.station-he {
  direction: rtl;
}

.kosher-badge {
  margin-top: 8px;
  padding: 6px 12px;
  border-radius: 999px;
  background: #e8f1ff;
}

.price {
  font-size: 32px;
  font-weight: bold;
}

/* CONTENT */

.section {
  margin-top: 30px;
}

.dish-name-en {
  font-size: 28px;
  font-weight: bold;
}

.dish-name-he {
  direction: rtl;
  text-align: right;
  font-size: 30px;
  font-weight: bold;
}

.description {
  margin-top: 10px;
}

.description.he {
  direction: rtl;
  text-align: right;
}

.ingredients {
  margin-top: 10px;
  background: #fafafa;
  padding: 12px;
  border-radius: 12px;
}

.ingredients.he {
  direction: rtl;
  text-align: right;
}

.label.he {
  direction: rtl;
  text-align: right;
}

.divider {
  height: 1px;
  background: #ddd;
  margin: 30px 0;
}

.allergen-card {
  margin-top: 30px;
  padding: 16px;
  border: 1px solid #ffd6d6;
  background: #fff8f8;
  border-radius: 16px;
}

.allergen-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
}

.allergen-text.he {
  direction: rtl;
  text-align: right;
}

</style>
</head>

<body>

<div class="container">

<!-- LEFT SIDE -->
<div>

<div class="card">
<textarea id="inputText" placeholder="Paste menu here"></textarea>
<br><br>
<button onclick="extractData()">Extract</button>
</div>

<div class="card">
<table id="table"></table>
</div>

</div>

<!-- RIGHT SIDE -->
<div>

<div class="page-wrap">

<div class="top-accent"></div>

<div class="brand-title">Caffè Macs</div>

<div class="header-card">
  <div>
    <div class="station-line">
      <span id="catEn"></span> | <span id="catHe" class="station-he"></span>
    </div>
    <div class="kosher-badge" id="kosher"></div>
  </div>
  <div class="price" id="price"></div>
</div>

<div class="section">
  <div class="dish-name-en" id="nameEn"></div>
  <div class="description" id="descEn"></div>

  <div>Ingredients</div>
  <div class="ingredients" id="ingEn"></div>
</div>

<div class="divider"></div>

<div class="section">
  <div class="dish-name-he" id="nameHe"></div>
  <div class="description he" id="descHe"></div>

  <div class="label he">מרכיבים</div>
  <div class="ingredients he" id="ingHe"></div>
</div>

<div class="allergen-card">
  <div>Allergens / אלרגנים</div>
  <div class="allergen-grid">
    <div id="allEn"></div>
    <div id="allHe" class="allergen-text he"></div>
  </div>
</div>

</div>

</div>

</div>

<script>

let dishes = []

async function extractData() {
  const text = document.getElementById("inputText").value

  const res = await fetch("/extract", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ text })
  })

  const data = await res.json()
  dishes = data.dishes

  renderTable()
  loadDish(0)
}

function renderTable() {
  const table = document.getElementById("table")
  table.innerHTML = ""

  dishes.forEach((d, i) => {
    table.innerHTML += `
      <tr>
        <td>${d.name_he}</td>
        <td><button onclick="loadDish(${i})">Select</button></td>
      </tr>
    `
  })
}

function loadDish(i) {
  const d = dishes[i]

  document.getElementById("catEn").innerText = d.category
  document.getElementById("catHe").innerText = d.category
  document.getElementById("kosher").innerText = d.kosher + " | " + d.kosher
  document.getElementById("price").innerText = "₪" + d.price

  document.getElementById("nameEn").innerText = d.name_en
  document.getElementById("descEn").innerText = d.description_en
  document.getElementById("ingEn").innerText = d.ingredients_en

  document.getElementById("nameHe").innerText = d.name_he
  document.getElementById("descHe").innerText = d.description_he
  document.getElementById("ingHe").innerText = d.ingredients_he

  document.getElementById("allEn").innerText = d.allergens
  document.getElementById("allHe").innerText = d.allergens
}

</script>

</body>
</html>
