<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>Menu Display AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
      color: #111;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .panel, .display {
      background: white;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    label {
      display: block;
      margin-top: 14px;
      font-weight: 700;
      font-size: 14px;
    }

    input, textarea, select {
      width: 100%;
      box-sizing: border-box;
      margin-top: 6px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 15px;
      font-family: Arial, sans-serif;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    button {
      margin-top: 18px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
      font-weight: 700;
    }

    button.secondary {
      background: #444;
    }

    .display {
      min-height: 640px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .category-mark {
      width: 0;
      height: 0;
      border-left: 28px solid transparent;
      border-right: 28px solid transparent;
      border-bottom: 48px solid #999;
      position: absolute;
      top: 22px;
      left: 22px;
    }

    .category-meat { border-bottom-color: #c5161d; }
    .category-dairy { border-bottom-color: #1f6fd1; }
    .category-vegan { border-bottom-color: #2f9e44; }

    .dish-title-he {
      font-size: 42px;
      font-weight: 800;
      margin-top: 56px;
      margin-bottom: 8px;
    }

    .dish-title-en {
      font-size: 28px;
      font-weight: 500;
      color: #555;
      margin-bottom: 28px;
      direction: ltr;
      text-align: left;
    }

    .description {
      font-size: 21px;
      line-height: 1.45;
      margin-bottom: 18px;
    }

    .english {
      direction: ltr;
      text-align: left;
    }

    .price {
      font-size: 34px;
      font-weight: 800;
      margin-top: 24px;
    }

    .bottom {
      border-top: 1px solid #ddd;
      padding-top: 14px;
      font-size: 13px;
      color: #333;
      line-height: 1.4;
    }

    .status {
      font-size: 14px;
      color: #666;
      margin-top: 10px;
      min-height: 18px;
    }

    @media print {
      body { background: white; }
      .panel { display: none; }
      .container {
        display: block;
        padding: 0;
        max-width: none;
      }
      .display {
        box-shadow: none;
        border-radius: 0;
        min-height: 96vh;
      }
    }

    @media (max-width: 850px) {
      .container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <section class="panel">
      <h1>יצירת דף Display</h1>

      <label>שפת מקור</label>
      <select id="source_language">
        <option value="Hebrew">עברית</option>
        <option value="English">English</option>
      </select>

      <label>שם מנה</label>
      <input id="dish_name" placeholder="לדוגמה: חזה עוף ופסטה טבחה">

      <label>תיאור מנה</label>
      <textarea id="description" placeholder="הכנס בדיוק את התיאור הרצוי"></textarea>

      <label>רכיבים</label>
      <textarea id="ingredients" placeholder="הכנס רכיבים בדיוק כפי שצריכים להופיע"></textarea>

      <label>אלרגנים</label>
      <textarea id="allergens" placeholder="לדוגמה: גלוטן, ביצים, סויה"></textarea>

      <label>מחיר</label>
      <input id="price" placeholder="לדוגמה: 55 ₪">

      <label>קטגוריה</label>
      <select id="category">
        <option value="Meat">בשרי</option>
        <option value="Dairy">חלבי</option>
        <option value="Vegan">טבעוני</option>
      </select>

      <button onclick="translateDish()">תרגם וצור Display</button>
      <button class="secondary" onclick="window.print()">הדפס / שמור כ-PDF</button>
      <div class="status" id="status"></div>
    </section>

    <section class="display" id="display">
      <div id="categoryMark" class="category-mark category-meat"></div>

      <div>
        <div class="dish-title-he" id="dishTitleHe">שם המנה</div>
        <div class="dish-title-en" id="dishTitleEn">Dish name</div>

        <div class="description" id="descriptionHe">תיאור המנה יופיע כאן.</div>
        <div class="description english" id="descriptionEn">The dish description will appear here.</div>

        <div class="price" id="priceDisplay">₪</div>
      </div>

      <div class="bottom">
        <div><strong>רכיבים:</strong> <span id="ingredientsHe"></span></div>
        <div class="english"><strong>Ingredients:</strong> <span id="ingredientsEn"></span></div>
        <br>
        <div><strong>אלרגנים:</strong> <span id="allergensHe"></span></div>
        <div class="english"><strong>Allergens:</strong> <span id="allergensEn"></span></div>
      </div>
    </section>
  </div>

  <script>
    function setCategoryMark(category) {
      const mark = document.getElementById("categoryMark");
      mark.className = "category-mark";
      if (category === "Meat") mark.classList.add("category-meat");
      else if (category === "Dairy") mark.classList.add("category-dairy");
      else if (category === "Vegan") mark.classList.add("category-vegan");
    }

    async function translateDish() {
      const status = document.getElementById("status");
      status.textContent = "מתרגם...";

      const payload = {
        source_language: document.getElementById("source_language").value,
        dish_name: document.getElementById("dish_name").value,
        description: document.getElementById("description").value,
        ingredients: document.getElementById("ingredients").value,
        allergens: document.getElementById("allergens").value,
        price: document.getElementById("price").value,
        category: document.getElementById("category").value
      };

      try {
        const res = await fetch("/translate", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (!res.ok) {
          status.textContent = data.error || "שגיאה בתרגום";
          return;
        }

        document.getElementById("dishTitleHe").textContent = data.dish_name_he || "";
        document.getElementById("dishTitleEn").textContent = data.dish_name_en || "";
        document.getElementById("descriptionHe").textContent = data.description_he || "";
        document.getElementById("descriptionEn").textContent = data.description_en || "";
        document.getElementById("ingredientsHe").textContent = data.ingredients_he || "";
        document.getElementById("ingredientsEn").textContent = data.ingredients_en || "";
        document.getElementById("allergensHe").textContent = data.allergens_he || "";
        document.getElementById("allergensEn").textContent = data.allergens_en || "";
        document.getElementById("priceDisplay").textContent = data.price || "";
        setCategoryMark(data.category || payload.category);

        status.textContent = "מוכן";
      } catch (err) {
        status.textContent = "שגיאה: " + err.message;
      }
    }
  </script>
</body>
</html>
