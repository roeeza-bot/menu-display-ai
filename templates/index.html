<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Menu Display AI</title>

<style>
body {
  margin:0;
  font-family: Arial, Helvetica, sans-serif;
  background:#f3f3f3;
  color:#1d1d1f;
}

.app {
  padding:20px;
}

.box {
  background:white;
  padding:22px;
  margin-bottom:18px;
  border-radius:18px;
}

textarea, input {
  width:100%;
  box-sizing:border-box;
  padding:10px;
  margin-top:8px;
  border:1px solid #c7c7cc;
}

button {
  width:100%;
  padding:13px;
  margin-top:12px;
  font-weight:bold;
  cursor:pointer;
}

.grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

/* DISPLAY */
.display-page {
  width:794px;
  height:1123px;
  background:white;
  margin:30px auto;
  padding:46px;
  box-sizing:border-box;
}

.top-row {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:28px;
  direction:ltr;
}

.logo {
  font-weight:800;
  letter-spacing:1.5px;
  color:#6e6e73;
}

.tags {
  display:flex;
  gap:10px;
}

.tag {
  border:1px solid #d2d2d7;
  border-radius:20px;
  padding:7px 16px;
  font-size:14px;
  font-weight:700;
}

.kosher-meat {
  color:#b42318;
  border-color:#f0b8b3;
  background:#fff5f5;
}

.kosher-dairy {
  color:#175cd3;
  border-color:#b2ccff;
  background:#eff8ff;
}

.kosher-parve {
  color:#027a48;
  border-color:#abefc6;
  background:#ecfdf3;
}

.price-box {
  border:1px solid #d2d2d7;
  border-radius:18px;
  padding:18px;
  display:flex;
  justify-content:space-between;
  margin-bottom:26px;
}

.price-value {
  font-size:30px;
  font-weight:900;
}

.en { direction:ltr; text-align:left; }
.he { direction:rtl; text-align:right; }

.title { font-size:34px; font-weight:900; }
.desc { font-size:20px; margin:10px 0; }

.section-title {
  font-size:13px;
  font-weight:900;
  letter-spacing:1.5px;
  color:#6e6e73;
  margin-top:20px;
}

.ingredients {
  font-size:14px;
  color:#4a4a4a;
}

.allergen-grid {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.allergen-pill {
  border:1px solid #d2d2d7;
  border-radius:18px;
  padding:7px;
  text-align:center;
  font-weight:bold;
}

@media print {
  .app { display:none; }
}
</style>
</head>

<body>

<div class="app">

<h2>הדבק טקסט</h2>
<textarea id="raw"></textarea>
<button onclick="runExtract()">Extract</button>

<div class="grid">
<input id="dishNameEn" placeholder="English name">
<input id="dishNameHe" placeholder="שם בעברית">

<textarea id="descEn" placeholder="Description EN"></textarea>
<textarea id="descHe" placeholder="תיאור"></textarea>

<textarea id="ingredientsEn" placeholder="Ingredients EN"></textarea>
<textarea id="ingredientsHe" placeholder="רכיבים"></textarea>

<textarea id="allergensEn" placeholder="Allergens EN"></textarea>
<textarea id="allergensHe" placeholder="אלרגנים"></textarea>

<input id="price" placeholder="מחיר">
<input id="station" placeholder="Sandwich / Grill / Sushi">
<input id="kosher" placeholder="בשרי / חלבי / פרווה">
</div>

<button onclick="createDisplay()">Create</button>
<button onclick="window.print()">PDF</button>

</div>

<div class="display-page">

<div class="top-row">
<div class="logo">CAFFÈ MACS</div>

<div class="tags">
<div class="tag" id="tagStation"></div>
<div class="tag" id="tagKosher"></div>
</div>
</div>

<div class="price-box">
<div>DISH PRICE / מחיר מנה</div>
<div class="price-value" id="priceOut"></div>
</div>

<div class="en">
<div class="title" id="nameEnOut"></div>
<div class="desc" id="descEnOut"></div>
<div class="section-title">Ingredients</div>
<div class="ingredients" id="ingEnOut"></div>
</div>

<div class="he">
<div class="title" id="nameHeOut"></div>
<div class="desc" id="descHeOut"></div>
<div class="section-title">רכיבים</div>
<div class="ingredients" id="ingHeOut"></div>
</div>

<div class="section-title">Allergens / אלרגנים</div>
<div class="allergen-grid" id="allergensOut"></div>

</div>

<script>
function safe(v){return v||""}

async function runExtract(){
  const res = await fetch("/extract",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({text:raw.value})
  })
  const d = await res.json()

  dishNameEn.value = safe(d.dish_name_en)
  dishNameHe.value = safe(d.dish_name_he)
  descEn.value = safe(d.description_en)
  descHe.value = safe(d.description_he)
  ingredientsEn.value = safe(d.ingredients_en)
  ingredientsHe.value = safe(d.ingredients_he)
  allergensEn.value = safe(d.allergens_en)
  allergensHe.value = safe(d.allergens_he)
}

function createDisplay(){

priceOut.innerText = price.value ? "₪"+price.value+".00":""

tagStation.innerText = station.value
tagKosher.innerText = kosher.value

tagKosher.className = "tag"

if(kosher.value.includes("בשר")) tagKosher.classList.add("kosher-meat")
if(kosher.value.includes("חלב")) tagKosher.classList.add("kosher-dairy")
if(kosher.value.includes("פרווה")) tagKosher.classList.add("kosher-parve")

nameEnOut.innerText = dishNameEn.value
nameHeOut.innerText = dishNameHe.value
descEnOut.innerText = descEn.value
descHeOut.innerText = descHe.value
ingEnOut.innerText = ingredientsEn.value
ingHeOut.innerText = ingredientsHe.value

allergensOut.innerHTML=""
allergensEn.value.split(",").forEach((a,i)=>{
  const div=document.createElement("div")
  div.className="allergen-pill"
  div.innerText=a.trim()+" / "+(allergensHe.value.split(",")[i]||"")
  allergensOut.appendChild(div)
})

}
</script>

</body>
</html>
