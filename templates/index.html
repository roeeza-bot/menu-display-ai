<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Caffè Macs Generator</title>

<style>
body { margin:0; font-family:Arial; background:#ececef; }

.container {
  display:grid;
  grid-template-columns: 1fr 1fr;
  gap:20px;
  padding:20px;
}

/* LEFT PANEL */
.panel {
  background:white;
  padding:20px;
  border-radius:16px;
}

input, textarea, select {
  width:100%;
  padding:8px;
  margin-bottom:10px;
}

button {
  padding:10px;
  border:none;
  border-radius:999px;
  background:#0071e3;
  color:white;
  cursor:pointer;
}

/* ====== RIGHT SIDE (לא נוגע בעיצוב שלך) ====== */

.page-wrap {
  background:white;
  border-radius:28px;
  padding:42px;
  position:relative;
}

.top-accent {
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:10px;
}

.brand-title {
  text-align:center;
  font-size:34px;
  font-weight:bold;
  margin-bottom:30px;
}

.header-card {
  display:flex;
  justify-content:space-between;
  padding:20px;
  background:#f8f8fa;
  border-radius:20px;
}

.station-he { direction:rtl; }

.dish-name-he {
  direction:rtl;
  text-align:right;
  font-size:28px;
  font-weight:bold;
}

.description.he {
  direction:rtl;
  text-align:right;
}

.ingredients.he {
  direction:rtl;
  text-align:right;
}

.label.he {
  direction:rtl;
  text-align:right;
}

.divider {
  height:1px;
  background:#ddd;
  margin:30px 0;
}

.allergen-card {
  background:#fff8f8;
  padding:15px;
  border-radius:16px;
}

.allergen-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
}

.allergen-text.he {
  direction:rtl;
  text-align:right;
}

</style>
</head>

<body>

<div class="container">

<!-- LEFT SIDE -->
<div class="panel">

<h3>Manual Input</h3>

<select id="category" onchange="updateAuto()">
  <option>Grill</option>
  <option>Chef Special</option>
  <option>Sandwich</option>
  <option>Soup</option>
  <option>Fish Special</option>
  <option>Pizza</option>
  <option>Bakery</option>
  <option>Veg/Vegan</option>
  <option>Sushi</option>
  <option>Salad Bar</option>
</select>

<input id="price" placeholder="Price">

<hr>

<h4>English</h4>
<input id="nameEn" placeholder="Name EN">
<textarea id="descEn" placeholder="Description EN"></textarea>
<textarea id="ingEn" placeholder="Ingredients EN" oninput="updateAllergens()"></textarea>

<hr>

<h4>עברית</h4>
<input id="nameHe" placeholder="שם מנה">
<textarea id="descHe" placeholder="תיאור"></textarea>
<textarea id="ingHe" placeholder="מרכיבים"></textarea>

<hr>

<h4>Allergens (auto)</h4>
<input id="allEn" readonly>
<input id="allHe" readonly>

<br>
<button onclick="updatePreview()">Update Preview</button>

</div>

<!-- RIGHT SIDE (DISPLAY) -->
<div>

<div class="page-wrap">

<div id="accent" class="top-accent"></div>

<div class="brand-title">Caffè Macs</div>

<div class="header-card">
  <div>
    <div>
      <span id="catEn"></span> |
      <span id="catHe" class="station-he"></span>
    </div>
    <div id="kosher"></div>
  </div>
  <div id="priceView"></div>
</div>

<div>
  <div id="nameEnView"></div>
  <div id="descEnView"></div>
  <div>Ingredients</div>
  <div id="ingEnView"></div>
</div>

<div class="divider"></div>

<div>
  <div id="nameHeView" class="dish-name-he"></div>
  <div id="descHeView" class="description he"></div>
  <div class="label he">מרכיבים</div>
  <div id="ingHeView" class="ingredients he"></div>
</div>

<div class="allergen-card">
  <div>Allergens / אלרגנים</div>
  <div class="allergen-grid">
    <div id="allEnView"></div>
    <div id="allHeView" class="allergen-text he"></div>
  </div>
</div>

</div>

</div>

</div>

<script>

/* ===== CATEGORY MAP ===== */

const categoryMap = {
  "Grill": ["גריל","Meat","בשרי","red"],
  "Chef Special": ["ספיישל שף","Meat","בשרי","red"],
  "Sandwich": ["כריכים","Meat","בשרי","red"],
  "Soup": ["מרקים","","","gray"],
  "Fish Special": ["ספיישל דגים","Dairy","חלבי","blue"],
  "Pizza": ["פיצה","Dairy","חלבי","blue"],
  "Bakery": ["מאפייה","Dairy","חלבי","blue"],
  "Veg/Vegan": ["צמחוני","Dairy","חלבי","blue"],
  "Sushi": ["סושי","Meat","בשרי","red"],
  "Salad Bar": ["סלטים","","","gray"]
}

/* ===== ALLERGEN ENGINE ===== */

function updateAllergens() {
  let text = document.getElementById("ingEn").value.toLowerCase()

  let map = {
    "milk":"חלב",
    "egg":"ביצים",
    "eggs":"ביצים",
    "gluten":"גלוטן",
    "wheat":"חיטה",
    "fish":"דגים",
    "soy":"סויה",
    "sesame":"שומשום",
    "nuts":"אגוזים",
    "peanut":"בוטנים",
    "celery":"סלרי"
  }

  let en=[]
  let he=[]

  for (let key in map) {
    if (text.includes(key)) {
      en.push(key)
      he.push(map[key])
    }
  }

  document.getElementById("allEn").value = en.join(", ")
  document.getElementById("allHe").value = he.join(", ")
}

/* ===== AUTO CATEGORY ===== */

function updateAuto() {
  let cat = document.getElementById("category").value
  let data = categoryMap[cat]

  document.getElementById("catEn").innerText = cat
  document.getElementById("catHe").innerText = data[0]

  document.getElementById("kosher").innerText =
    data[1] + " | " + data[2]

  let color = data[3]

  if (color === "red") document.getElementById("accent").style.background = "red"
  else if (color === "blue") document.getElementById("accent").style.background = "blue"
  else document.getElementById("accent").style.background = "#999"
}

/* ===== UPDATE PREVIEW ===== */

function updatePreview() {

  updateAuto()

  document.getElementById("priceView").innerText =
    "₪" + document.getElementById("price").value

  document.getElementById("nameEnView").innerText =
    document.getElementById("nameEn").value

  document.getElementById("descEnView").innerText =
    document.getElementById("descEn").value

  document.getElementById("ingEnView").innerText =
    document.getElementById("ingEn").value

  document.getElementById("nameHeView").innerText =
    document.getElementById("nameHe").value

  document.getElementById("descHeView").innerText =
    document.getElementById("descHe").value

  document.getElementById("ingHeView").innerText =
    document.getElementById("ingHe").value

  document.getElementById("allEnView").innerText =
    document.getElementById("allEn").value

  document.getElementById("allHeView").innerText =
    document.getElementById("allHe").value
}

</script>

</body>
</html>
