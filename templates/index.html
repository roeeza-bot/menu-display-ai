<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Menu AI</title>

<style>
body {font-family: Arial; background:#f5f5f5; padding:20px;}
textarea {width:100%; height:150px; padding:10px;}
input {width:100%; padding:10px; margin-top:10px;}
button {padding:12px; margin-top:10px; width:100%;}

.display {
    background:white;
    padding:30px;
    margin-top:20px;
    border-radius:20px;
}

.title {font-size:32px; font-weight:bold;}
.desc {margin-top:10px;}
.section {margin-top:20px;}
.price {font-size:28px; font-weight:bold;}
</style>

</head>
<body>

<h2>הדבק תוכן מה-PDF</h2>

<textarea id="raw"></textarea>

<input id="price" placeholder="מחיר ידני">

<button onclick="run()">Extract & Create Display</button>

<div class="display">
    <div class="price" id="priceOut"></div>
    <div class="title" id="nameEn"></div>
    <div class="title" id="nameHe"></div>

    <div class="desc" id="descEn"></div>
    <div class="desc" id="descHe"></div>

    <div class="section">
        <b>Ingredients</b>
        <div id="ingEn"></div>
        <div id="ingHe"></div>
    </div>

    <div class="section">
        <b>אלרגנים / Allergens</b>
        <div id="allHe"></div>
        <div id="allEn"></div>
    </div>
</div>

<script>
async function run() {

    const res = await fetch("/extract", {
        method:"POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
            text: document.getElementById("raw").value
        })
    });

    const data = await res.json();

    document.getElementById("priceOut").innerText = document.getElementById("price").value;

    document.getElementById("nameEn").innerText = data.dish_name_en;
    document.getElementById("nameHe").innerText = data.dish_name_he;

    document.getElementById("descEn").innerText = data.description_en;
    document.getElementById("descHe").innerText = data.description_he;

    document.getElementById("ingEn").innerText = data.ingredients_en;
    document.getElementById("ingHe").innerText = data.ingredients_he;

    document.getElementById("allEn").innerText = data.allergens_en;
    document.getElementById("allHe").innerText = data.allergens_he;
}
</script>

</body>
</html>
