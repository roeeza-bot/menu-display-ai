<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Menu Display AI</title>

<style>
body{margin:0;font-family:Arial;background:#f3f3f3}
.app{padding:20px}
textarea,input{width:100%;padding:10px;margin-top:8px;border:1px solid #ccc}
button{width:100%;padding:12px;margin-top:10px;font-weight:bold}

.display{
width:794px;
min-height:1123px;
background:white;
margin:30px auto;
padding:40px;
}

.top{
display:flex;
justify-content:space-between;
direction:ltr;
}

.logo{font-weight:bold}
.kosher-meat{color:red}
.kosher-dairy{color:blue}
.kosher-parve{color:green}

.category{
background:#eee;
padding:5px 12px;
border-radius:12px;
margin-top:10px;
display:inline-block;
}

.price{font-size:30px;font-weight:bold;margin-top:20px;text-align:right}

.title{font-size:32px;font-weight:bold;margin-top:20px}
.desc{margin-top:10px}

.section-title{margin-top:20px;font-weight:bold;color:#666}

.allergens{border:1px solid #ccc;padding:10px;margin-top:20px;border-radius:10px}
</style>
</head>

<body>

<div class="app">

<textarea id="raw"></textarea>
<button onclick="runExtract()">Extract</button>

<input id="dishNameEn" placeholder="English name">
<input id="dishNameHe" placeholder="שם בעברית">

<textarea id="descEn" placeholder="Description EN"></textarea>
<textarea id="descHe" placeholder="תיאור"></textarea>

<textarea id="ingredientsEn" placeholder="Ingredients EN"></textarea>
<textarea id="ingredientsHe" placeholder="רכיבים"></textarea>

<textarea id="allergensEn" placeholder="Allergens EN"></textarea>
<textarea id="allergensHe" placeholder="אלרגנים"></textarea>

<input id="price" placeholder="מחיר">
<input id="station" placeholder="קטגוריה">
<input id="kosher" placeholder="כשרות">

<button onclick="createDisplay()">Create</button>
<button onclick="window.print()">PDF</button>

</div>

<div class="display">

<div class="top">
<div class="logo">CAFFÈ MACS</div>
<div id="kosherOut"></div>
</div>

<div id="categoryOut" class="category"></div>

<div id="priceOut" class="price"></div>

<div id="nameEnOut" class="title"></div>
<div id="descEnOut" class="desc"></div>

<div class="section-title">Ingredients</div>
<div id="ingEnOut"></div>

<hr>

<div id="nameHeOut" class="title"></div>
<div id="descHeOut" class="desc"></div>

<div class="section-title">רכיבים</div>
<div id="ingHeOut"></div>

<div class="allergens">
<div class="section-title">Allergens</div>
<div id="allergensOut"></div>
</div>

</div>

<script>
function safe(v){return v||""}

function splitCategory(cat){
let station=cat
let kosher=""

if(cat.includes("Meat")){kosher="בשרי";station=cat.replace("(Meat)","")}
if(cat.includes("Dairy")){kosher="חלבי";station=cat.replace("(Dairy)","")}
if(cat.includes("Parve")){kosher="פרווה";station=cat.replace("(Parve)","")}

return{station,kosher}
}

async function runExtract(){
const res=await fetch("/extract",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({text:raw.value})
})

const d=await res.json()

const cat=splitCategory(safe(d.category))

dishNameEn.value=safe(d.dish_name_en)
dishNameHe.value=safe(d.dish_name_he)
descEn.value=safe(d.description_en)
descHe.value=safe(d.description_he)
ingredientsEn.value=safe(d.ingredients_en)
ingredientsHe.value=safe(d.ingredients_he)
allergensEn.value=safe(d.allergens_en)
allergensHe.value=safe(d.allergens_he)
station.value=cat.station
kosher.value=cat.kosher

createDisplay()
}

function createDisplay(){

priceOut.innerText=price.value? "₪"+price.value:""

categoryOut.innerText=station.value

kosherOut.innerText=kosher.value
kosherOut.className=""

if(kosher.value=="בשרי")kosherOut.className="kosher-meat"
if(kosher.value=="חלבי")kosherOut.className="kosher-dairy"
if(kosher.value=="פרווה")kosherOut.className="kosher-parve"

nameEnOut.innerText=dishNameEn.value
nameHeOut.innerText=dishNameHe.value
descEnOut.innerText=descEn.value
descHeOut.innerText=descHe.value
ingEnOut.innerText=ingredientsEn.value
ingHeOut.innerText=ingredientsHe.value

allergensOut.innerText=allergensEn.value+" / "+allergensHe.value
}
</script>

</body>
</html>
